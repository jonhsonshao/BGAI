        <div class="menu-trigger" id="menuBtn">

    <div class="pool-card">
        <h3>公平发射 · 规则说明</h3>
        <ul class="rule-list">
            <li>分配数量：2 亿枚</li>
            <li>参与方式：开盘价公开公平兑换</li>

            <li>剩余处理：周期结束未兑完部分全部销毁</li>

            </div>

                <span>兑换周期</span>
                <span>100 天</span>
            </div>
            <div class="buy-info-row">
                <span>剩余机制</span>

            <button class="join-btn" onclick="alert('五号公平发射待开发')">立即兑换</button>
